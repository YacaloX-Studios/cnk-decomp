name: build
on:
  push:
  pull_request:
  workflow_dispatch:

# Serialize per ref — a new push supersedes its in-flight run; main never
# cancelled so its report always finishes (mirrors crashwoc matching.yml).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [SLUS_206.49]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: python syntax check (tools)
        run: |
          set -e
          for t in tools/*.py; do python -m py_compile "$t"; done
          echo "py_compile OK"

      - name: regenerate analysis products (smoke)
        run: |
          python tools/make_registry.py || echo "make_registry skipped (needs SLUS_206.49)"
          python tools/score_functions.py || echo "score_functions skipped"
          python tools/infer_types.py SLUS_206.49 src/decomp 2>&1 | head -20 || echo "infer_types skipped (no ELF)"
          python tools/propagate_types.py || echo "propagate_types skipped"

      - name: host C check of recovered headers
        run: |
          gcc -Iinclude/engine -std=c11 -Wall -Wextra -c -o /dev/null include/engine/validate_headers.c
          echo "PASS (host gcc)"

      - name: generate objdiff config (guide step 3)
        run: |
          python tools/generate_objdiff_config.py --check
          cat objdiff.json

      - name: generate decomp.dev progress report (guide step 4)
        run: |
          mkdir -p build/${{ matrix.version }}
          # Prefer objdiff-cli if available (dtk-template/melee style), fallback to python generator
          if command -v objdiff-cli >/dev/null 2>&1; then
            objdiff-cli report generate -o build/${{ matrix.version }}/report.json || python tools/decomp_progress.py --out build/${{ matrix.version }}/report.json
          else
            python tools/decomp_progress.py --out build/${{ matrix.version }}/report.json
          fi
          cat build/${{ matrix.version }}/report.json

      - name: upload decomp.dev report artifact (guide step 5 — VERSION_report, melee uses GALE01_report)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_report
          path: build/${{ matrix.version }}/report.json
          if-no-files-found: error

      # Optional: si el repo ya está registrado en decomp.dev y DECOMP_DEV_TOKEN
      # está en Secrets (org o repo), hace POST directo. Normalmente basta con
      # el GitHub App (polling) — este paso es fallback y no-op sin token.
      - name: publish to decomp.dev
        if: env.DECOMP_DEV_TOKEN != ''
        env:
          DECOMP_DEV_TOKEN: ${{ secrets.DECOMP_DEV_TOKEN }}
        run: |
          curl -sS -X POST "https://decomp.dev/api/YacaloX-Studios/cnk-decomp/report" \
            -H "Authorization: Bearer $DECOMP_DEV_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @build/${{ matrix.version }}/report.json \
            | head -c 800; echo
